<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="zh/">
        <img src="assets/favicon.svg" alt="" width="36" height="36">
        <span data-i18n="siteName">Clocking</span>
      </a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 class="hero-title"><span class="highlight-pink" data-i18n="heroTitle">24小时制时钟</span></h1>
      <p class="hero-lead" data-i18n="heroLead">一天有24个小时。我们一起来学会读每一个钟点吧。</p>
      <div class="controls">
        <button type="button" class="btn btn-lesson" id="btn-lesson" aria-expanded="false" aria-controls="lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg><span>Start the lesson</span></button>
        <button type="button" class="btn btn-quiz" id="btn-quiz" aria-expanded="false" aria-controls="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg><span data-i18n="quizOpen">练习</span></button>
        <button type="button" class="btn" id="btn-now"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="nowButton">现在</span></button>
        <button type="button" class="btn btn-accent" id="btn-play" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="playButton">播放一天</span></button>
      </div>
      <p class="hero-hello" id="hero-hello" hidden><span></span> <button type="button" class="link-btn" data-i18n="nameChange">修改名字</button></p>
      <p class="visually-hidden" id="live" aria-live="polite"></p>
    </section>

    <section class="stage-section" aria-labelledby="stage-title">
      <h2 id="stage-title"><span class="highlight-green" data-i18n="stageTitle">数字时钟</span></h2>
      <p class="muted" data-i18n="stageHint">用箭头、上下滑动或键盘来改变小时和分钟。</p>
      <div class="stage" id="stage" data-phase="morning">
        <p class="phase-label" id="phase-name">Morning</p>

        <div class="clock-card card">
          <div class="digital" id="digital">
            <div class="spin" data-unit="hours">
              <button type="button" class="spin-btn" data-dir="1" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
              <div class="digits" role="spinbutton" tabindex="0" aria-valuemin="0" aria-valuemax="23" aria-label="小时" data-i18n-label="hoursGroup">
                <span class="slot">0</span><span class="slot">8</span>
              </div>
              <button type="button" class="spin-btn" data-dir="-1" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
            <span class="colon" aria-hidden="true">:</span>
            <div class="spin" data-unit="minutes">
              <button type="button" class="spin-btn" data-dir="1" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
              <div class="digits" role="spinbutton" tabindex="0" aria-valuemin="0" aria-valuemax="59" aria-label="分钟" data-i18n-label="minutesGroup">
                <span class="slot">1</span><span class="slot">5</span>
              </div>
              <button type="button" class="spin-btn" data-dir="-1" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
          </div>
          <div class="digital-labels">
            <span data-i18n="hoursLabel">小时（0–23）</span>
            <span data-i18n="minutesLabel">分钟（00–59）</span>
          </div>
          <p class="say"><span id="say-text">It's eight fifteen in the morning.</span> <span class="ampm" id="ampm">8:15 AM</span></p>
        </div>
      </div>
    </section>

    <section class="panel card board-panel" aria-labelledby="pairs-title">
      <h2 id="pairs-title"><span class="highlight-green" data-i18n="pairsTitle">成对的钟点</span></h2>
      <p class="muted" data-i18n="pairsHint">每一行的两个钟点读法相同。点一下钟点或图片就能跳过去。</p>
      <div class="pairs-board" id="pairs" role="group" aria-labelledby="pairs-title"></div>
    </section>

    <section class="panel card dial-panel" aria-labelledby="dial-title">
      <h2 id="dial-title"><span class="highlight-green" data-i18n="dialTitle">指针时钟</span></h2>
      <p class="muted" data-i18n="dialHint">像普通时钟一样拨动指针，再用太阳和月亮选择一天中的时段。</p>
      <div class="dial" id="dial">
      </div>
    </section>

  </main>

  <section class="lesson panel card" id="lesson" aria-labelledby="lesson-title" hidden>
    <div class="lesson-top">
      <span class="lesson-progress"></span>
      <button type="button" class="lesson-close" data-action="close" aria-label="Close the lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div aria-live="polite">
      <h2 class="lesson-title" id="lesson-title"><span class="highlight-green"></span></h2>
      <p class="lesson-body"></p>
      <div class="lesson-breakdown" hidden></div>
    </div>
    <div class="lesson-nav">
      <button type="button" class="btn" data-action="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>Back</span></button>
      <div class="lesson-dots" aria-hidden="true"></div>
      <button type="button" class="btn btn-accent" data-action="next"><span>Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <section class="lesson quiz panel card" id="quiz" aria-labelledby="quiz-prompt" hidden>
    <div class="lesson-top">
      <span class="lesson-progress quiz-progress"></span>
      <div class="quiz-stats">
        <span class="quiz-stat" data-stat="score"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg><span></span></span>
        <span class="quiz-stat" data-stat="streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.2 3.4 5 5.2 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2.2-4.6.2 1.8 1.1 2.8 2.3 3.1-.6-3-.4-5.8.5-8.5z"/></svg><span></span></span>
      </div>
      <button type="button" class="lesson-close quiz-sound" data-action="sound" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <button type="button" class="lesson-close" data-action="close" aria-label="Close practice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div aria-live="polite">
      <h2 class="lesson-title quiz-prompt" id="quiz-prompt"></h2>
      <p class="quiz-hint muted" hidden></p>
      <div class="quiz-options"></div>
      <p class="quiz-feedback" hidden></p>
    </div>
    <div class="lesson-nav">
      <div class="lesson-dots" aria-hidden="true"></div>
      <button type="button" class="btn btn-accent" data-action="quiz-next"><span>Next question</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="quiz-burst" aria-hidden="true"></div>
  </section>

  <section class="lesson panel card name-card" id="name-card" aria-labelledby="name-title" hidden>
    <h2 class="lesson-title" id="name-title"><span class="highlight-green"></span></h2>
    <p class="lesson-body name-body"></p>
    <div class="lesson-nav name-confirm" hidden>
      <button type="button" class="btn" data-action="someone-else"><span data-i18n="nameSomeoneElse">我是别人</span></button>
      <button type="button" class="btn btn-accent" data-action="its-me"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <form class="name-form">
      <label class="visually-hidden" for="name-input" data-i18n="nameLabel">你的名字</label>
      <input class="name-input" id="name-input" type="text" autocomplete="given-name" enterkeyhint="go" spellcheck="false" data-i18n-placeholder="namePlaceholder">
      <div class="lesson-nav">
        <button type="button" class="btn" data-action="skip"><span data-i18n="nameSkip">跳过</span></button>
        <button type="submit" class="btn btn-accent"><span data-i18n="nameGo">开始吧</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </form>
  </section>

  <footer class="site-footer">
    <div class="wrap muted">
      <p data-i18n="footerCredit">根据一张手绘的课程页面制作。</p>
      <p class="footer-privacy" data-i18n="footerPrivacy">匿名统计访问量，不使用 Cookie。</p>
    </div>
  </footer>
</body>
</html>
